  <!-- Typing Animation -->
  <script>
    AOS.init();

    const text = ["Full Stack Developer", "Web Developer", 'React Native Developer'];
    let index = 0;
    let charIndex = 0;
    const speed = 100;
    const typedText = document.getElementById("typed-text");

    function typeEffect() {
      if (charIndex < text[index].length) {
        typedText.textContent += text[index].charAt(charIndex);
        charIndex++;
        setTimeout(typeEffect, speed);
      } else {
        setTimeout(eraseEffect, 1500);
      }
    }

    function eraseEffect() {
      if (charIndex > 0) {
        typedText.textContent = text[index].substring(0, charIndex - 1);
        charIndex--;
        setTimeout(eraseEffect, speed);
      } else {
        index = (index + 1) % text.length;
        setTimeout(typeEffect, speed);
      }
    }

    document.addEventListener("DOMContentLoaded", typeEffect);
  </script>
